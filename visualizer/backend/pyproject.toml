[project]
name = "villageragent-visualizer-backend"
version = "0.1.0"
description = "Read-only VillagerAgent experiment visualizer API"
requires-python = "==3.10.19"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.7.0",
    "pytest==8.3.5",
]

[project.scripts]
villageragent-visualizer = "villageragent_visualizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/villageragent_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
